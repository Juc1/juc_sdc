"$schema": "https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json"
name: Group
description: "Flexbox layout container for orchestrating multiple items in rows, columns, or responsive stacks with gap spacing. For styling/positioning a single item, use Box."
group: Custom
status: stable
props:
  type: object
  required:
    - flex_direction
    - flex_align
    - items_align
  properties:
    flex_direction:
      type: string
      title: Item direction
      enum:
        - column
        - row
        - responsive-md
        - responsive-lg
      meta:enum:
        column: Vertical
        row: Horizontal
        responsive-md: "Responsive (Vertical on mobile, horizontal on desktop)"
        responsive-lg: "Responsive (Vertical on mobile, horizontal on large screens)"
      default: "column"
      examples:
        - "column"
    flex_gap:
      type: string
      title: Space between items
      enum:
        - sm
        - md
        - lg
        - xl
      meta:enum:
        sm: Small
        md: Medium
        lg: Large
        xl: Extra-Large
      examples:
        - md
    items_align:
      type: string
      title: Alignment within group
      enum:
        - start
        - center
        - end
      meta:enum:
        start: Start
        center: Center
        end: End
      default: "start"
      examples:
        - "start"
    flex_align:
      type: string
      title: Alignment within parent
      enum:
        - start
        - center
        - end
      meta:enum:
        start: Start
        center: Center
        end: End
      default: "center"
      examples:
        - "center"
    radius:
      type: string
      title: Rounded corners
      enum:
        - sm
        - md
        - lg
        - xl
      meta:enum:
        sm: Small
        md: Medium
        lg: Large
        xl: Extra-Large
      examples:
        - sm
    padding:
      type: string
      title: Padding
      enum:
        - sm
        - md
        - lg
        - xl
      meta:enum:
        sm: Small
        md: Medium
        lg: Large
        xl: Extra-Large
      examples:
        - sm
    background:
      type: string
      title: Background color
      enum:
        - default
        - base-100
        - base-200
        - base-300
        - primary
        - secondary
        - accent
        - neutral
        - info
        - success
        - warning
        - error
      meta:enum:
        default: "None (Transparent)"
        base-100: "Base 100"
        base-200: "Base 200"
        base-300: "Base 300"
        primary: "Primary"
        secondary: "Secondary"
        accent: "Accent"
        neutral: "Neutral"
        info: "Info"
        success: "Success"
        warning: "Warning"
        error: "Error"
      default: default
      examples:
        - default

slots:
  group_slot:
    title: "Group items"
